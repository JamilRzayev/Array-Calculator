services:
  db:
    image: postgres:15-alpine
    container_name: vpn_bot_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vpn_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    build: .
    container_name: vpn_bot_app
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - .:/app

volumes:
  postgres_data:
